name: Publish to Archive

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required: lets the job mint a GitHub OIDC token
    steps:
      - uses: actions/checkout@v4

      # Cross-repo composite actions don't resolve from a user-owned PRIVATE repo
      # via `uses: owner/repo@ref`, so check out the action repo locally instead.
      - name: Fetch the publish action
        uses: actions/checkout@v4
        with:
          repository: zachshallbetter/zach-core
          path: .zach-core
          token: ${{ secrets.ARCHIVE_ACTION_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: |
          npm install
          npm run build        # → dist/ (Vite, base './')

      - name: Publish to zach-core archive
        uses: ./.zach-core/.github/actions/publish-to-archive
        with:
          core-url: https://zach-core.vercel.app
          slug: snacking
          title: "Cookie Cruncher"
          summary: "A snack-clicker toy."
          tags: game,react,toy
          host: blob
          dir: dist
          entry: index.html
